[toolchain]
anchor_version = "1.2.1"
solana_version = "4.3.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
meridian = "9o9a9HpN6Aq4UBeozWshAKBugjtToxWdsVzSMPkVHEMX"
meridian_oracle = "3HDbiFX8iSf7zXfaYmFRPNnKsjUiLvF55rHperUvjjVY"

[programs.devnet]
meridian = "9o9a9HpN6Aq4UBeozWshAKBugjtToxWdsVzSMPkVHEMX"
meridian_oracle = "3HDbiFX8iSf7zXfaYmFRPNnKsjUiLvF55rHperUvjjVY"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
# Deploy as upgradeable programs with the provider wallet as upgrade authority, so the lifecycle
# tests can call initialize_config (it checks the program-data upgrade authority).
upgradeable = true

[scripts]
test = "npx mocha --node-option import=tsx --timeout 1000000 'tests/**/*.test.ts'"
