[package]
name = "meridian"
version = "0.1.0"
description = "Markets, order book and settlement"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = "1.2.1"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
# Same LiteSVM line as the oracle tests: newer runtime crates need a Rust newer than the 1.89 pin.
litesvm = "0.15"
agave-feature-set = "~4.1"
solana-account = "4"
solana-instruction-error = "2"
solana-keypair = "3"
solana-message = "4"
solana-program-option = "3"
solana-program-pack = "3"
solana-program-runtime = "~4.1"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-error = "3"
spl-token-interface = "2"
