# One job that runs the same gates as the pre-push hook (`make gates`) on the project's shell
# runner, using the toolchain installed on the runner host.
#
# Server-safety rules (see AGENTS.md): merge request pipelines only, interruptible, no retries,
# no artifacts, no remote cache, quiet logs.
#
# Caching is local to the runner host only:
# - node_modules/ and target/ stay in the build directory between pipelines (excluded from
#   `git clean`). node_modules/ is reinstalled only when package-lock.json changes.
# - npm's download cache (~/.npm) and the cargo registry (~/.cargo) live in the runner user's
#   home directory.
# - Program keypairs are not committed. `anchor keys sync` points the program IDs at the runner's
#   keypairs in target/deploy/ (generated on first run, then kept with target/).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - when: never

variables:
  GIT_CLEAN_FLAGS: -ffdx -e node_modules/ -e target/
  GIT_DEPTH: '1'
  HUSKY: '0'
  CARGO_TERM_QUIET: 'true'
  CARGO_TERM_PROGRESS_WHEN: never
  npm_config_loglevel: error
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

gates:
  stage: test
  interruptible: true
  retry: 0
  timeout: 30m
  script:
    - export PATH="$HOME/.local/share/solana/install/active_release/bin:/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
    - |
      lock_hash=$(shasum package-lock.json | cut -d' ' -f1)
      if [ "$(cat node_modules/.lock-hash 2>/dev/null)" != "$lock_hash" ]; then
        npm ci --no-audit --no-fund --loglevel=error
        echo "$lock_hash" > node_modules/.lock-hash
      fi
    - anchor keys sync > /dev/null
    - make -s gates
