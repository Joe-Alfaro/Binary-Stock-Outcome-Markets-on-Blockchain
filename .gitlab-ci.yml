# Runs the same gates as the pre-push hook (`make gates`) on the project's shell runner, which
# uses the toolchain installed on the runner host (rustup, Anza Solana CLI, Anchor, Node).
#
# Caching on a shell executor:
# - node_modules/ uses the GitLab cache, keyed on package-lock.json.
# - target/ stays in the build directory between jobs (excluded from `git clean`). Zipping it into
#   a cache archive on every job is slower than Cargo's own incremental builds.
# - Program keypairs are not committed. `anchor keys sync` points the program IDs at the runner's
#   keypairs in target/deploy/ (generated on first run, then kept with target/).
# - The cargo registry lives in the runner user's ~/.cargo and persists across jobs already.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - test

variables:
  GIT_CLEAN_FLAGS: -ffdx -e target/
  HUSKY: '0'
  npm_config_cache: $CI_PROJECT_DIR/.npm

default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  before_script:
    - export PATH="$HOME/.local/share/solana/install/active_release/bin:/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
    - test -d node_modules || npm ci --no-audit --no-fund

format-lint-types:
  stage: check
  script:
    - npm run format:check
    - npm run lint
    # The Anchor tests import types generated by `anchor build`.
    - anchor keys sync
    - anchor build
    - npm run typecheck

rust-lint:
  stage: check
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings

unit-tests:
  stage: test
  script:
    - npm test
    - cargo test --workspace

anchor-tests:
  stage: test
  script:
    - anchor keys sync
    - anchor build
    - anchor test --skip-build --validator legacy
